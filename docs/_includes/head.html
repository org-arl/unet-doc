<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.longname }} · {{ site.tagline }}{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">

    <meta property="og:title" content="{{ site.longname }}" />
    <meta property="og:url" content="{{ site.website }}" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="{{ site.description }}" />
    <meta property="og:image" content="{{ site.website }}/{{ site.image_path }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="UnetStack — the Underwater Networks Project" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@{{ site.twitter }}" />
    <meta name="twitter:image" content="{{ site.website }}/{{ site.image_path }}" />
    <meta name="cloudflare-recovery" content="For recovery of cloudflare account">
    <meta name="msvalidate.01" content="86C2100214BB9E0AE3533B66785EC9CB" />

    {% capture version %}{% include_relative version.txt %}{% endcapture %}
    {% assign version = version | strip_newlines %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "{{ site.longname }}",
          "url": "{{ site.url }}/"
        },
        {
          "@type": "SoftwareApplication",
          "name": "{{ site.longname }}",
          "url": "{{ site.url }}/",
          "description": {{ site.description | jsonify }},
          "applicationCategory": "DeveloperApplication",
          "applicationSubCategory": "Underwater acoustic network stack and simulator",
          "operatingSystem": "macOS, Linux, Windows",
          "softwareVersion": "{{ version }}",
          "downloadUrl": "{{ site.url }}/downloads/unet-community-{{ version }}.tgz",
          "releaseNotes": "{{ site.url }}/releasenotes.txt",
          "image": "{{ site.url }}/{{ site.image_path }}",
          "publisher": [
            { "@type": "Organization", "name": "Acoustic Research Laboratory, National University of Singapore", "url": "https://arl.nus.edu.sg/" },
            { "@type": "Organization", "name": "Subnero Pte Ltd", "url": "https://subnero.com/" }
          ],
          "sameAs": [
            "https://github.com/org-arl/unet-contrib",
            "https://www.youtube.com/channel/UCnwSva23AuUCFPqgI0kPvdw",
            "https://blog.unetstack.net/"
          ]
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="preload" as="image" href="img/hero.jpeg" fetchpriority="high">
    <link rel="stylesheet" href="css/site.css">
</head>
