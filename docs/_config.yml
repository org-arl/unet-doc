title: Unet
longname: UnetStack
tagline: Underwater acoustic network stack and simulator
description: The Underwater Networks Project. Design, simulate, test and deploy underwater acoustic networks with an agent-based network stack and simulator.
url: "https://unetstack.net"
baseurl: ""
website: "https://unetstack.net"
markdown: kramdown
theme: minima
twitter: unetstack
image_path: img/og-card.jpg
sass:
  style: compressed
  sourcemap: false
github:
  repository_url: https://github.com/org-arl/unet-doc
plugins:
  - jekyll-sitemap
# keep the sitemap to canonical, indexable pages: skip javadoc, the archived
# handbook edition and the JS redirect stubs
defaults:
  - scope: { path: "javadoc" }
    values: { sitemap: false }
  - scope: { path: "api" }
    values: { sitemap: false }
  - scope: { path: "handbook-ed1v3" }
    values: { sitemap: false }
  - scope: { path: "docs.html" }
    values: { sitemap: false }
  - scope: { path: "downloads" }
    values: { sitemap: false }
